name: Publish HomeDPI image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish (for example 2.4.11.22.6)
        required: true
        default: 2.4.11.22.6

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    name: Build and publish HomeDPI
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # Accept optional v prefix, 3- or 5-segment version, optional -rN suffix.
          # BASH_REMATCH[1] is the pure version used for asset name and image tag.
          if [[ ! "$RELEASE_TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+\.[0-9]+)?)(-r[0-9]+)?$ ]]; then
            echo "Expected a stable tag like 2.4.11.22.6 (v prefix and -rN suffix optional); got: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download and verify the Docker installation package
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          package="homedpi-docker-${VERSION}.tar.gz"
          base="https://github.com/wood543/HomeDPI/releases/download/${RELEASE_TAG}"
          mkdir -p "$RUNNER_TEMP/homedpi-release"
          cd "$RUNNER_TEMP/homedpi-release"
          curl --fail --location --retry 3 "$base/$package" --output "$package"
          curl --fail --location --retry 3 "$base/sha256sums.txt" --output sha256sums.txt
          sha256sum --ignore-missing --check sha256sums.txt
          mkdir build
          tar -xzf "$package" --no-same-owner -C build
          test -f build/homedpi/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: wood543
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/homedpi-release/build/homedpi
          file: ${{ runner.temp }}/homedpi-release/build/homedpi/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            wood543/homedpi:${{ steps.release.outputs.version }}
            wood543/homedpi:latest
